[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrasse"
dynamic = ["version"]
description = "AI code review that reads the code before it comments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wrasse = "wrasse.cli:main"

[project.urls]
Homepage = "https://github.com/Coral-Bricks-AI/wrasse"

[tool.setuptools.dynamic]
version = { attr = "wrasse.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
